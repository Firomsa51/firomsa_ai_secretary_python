# Alembic configuration — https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts directory
script_location = migrations

# File name template for new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Maximum length for the slug portion of the filename
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# sqlalchemy.url is intentionally left blank here.
# The URL is read from the DATABASE_URL environment variable in migrations/env.py.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
