version: "1"

# ── Firomsa AI Secretary — Render Blueprint ───────────────────────────────────
# Deploy with: render blueprint launch
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── API / Worker service ───────────────────────────────────────────────────
  - type: web
    name: firomsa-ai-secretary
    runtime: python
    region: oregon
    plan: starter               # upgrade to "standard" for production

    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # ── Security ────────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true

      # ── Database — auto-wired from the managed Postgres below ───────────────
      - key: DATABASE_URL
        fromDatabase:
          name: firomsa-db
          property: connectionString

      # ── Telegram ────────────────────────────────────────────────────────────
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      - key: TELEGRAM_SESSION
        sync: false

      # ── AI Provider ─────────────────────────────────────────────────────────
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

# ── Managed PostgreSQL database ────────────────────────────────────────────
databases:
  - name: firomsa-db
    databaseName: firomsa
    user: firomsa
    plan: starter
